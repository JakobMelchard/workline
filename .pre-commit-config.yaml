# Hooks come from pinned repos; Renovate bumps the revs. CI runs the same config through
# JakobMelchard/.github hooks.yml. Setup: brew install prek && prek install
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/JakobMelchard/.githooks
    rev: v1.0.1
    hooks:
      - id: conventional-commit
  - repo: local
    hooks:
      # the org eslint hook runs --quiet; warnings fail here as in CI
      - id: eslint
        name: eslint
        entry: npx --no-install eslint --max-warnings 0
        language: system
        types: [javascript]
      # workline is a dependency: a broken export reaches every consumer before their CI runs
      - id: tsc
        name: tsc
        entry: npx --no-install tsc
        language: system
        pass_filenames: false
        types_or: [javascript, ts]
      - id: test
        name: npm test
        entry: npm test --silent
        language: system
        pass_filenames: false
        types_or: [javascript, ts]
