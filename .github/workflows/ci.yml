name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  js:
    uses: JakobMelchard/.github/.github/workflows/node.yml@main
    with:
      # No committed lockfile, so npm ci would fail.
      install-cmd: npm install
      lint-cmd: ""
      check-cmd: npx tsc
      # Regenerate from grammar.js: committed parser sources must match, and
      # the vectors run against the freshly built wasm.
      test-cmd: npm run build && git diff --exit-code -- src/ && npm test
  go:
    uses: JakobMelchard/.github/.github/workflows/go.yml@main
  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@main
    with:
      # tsc and npm test run in the js job above
      skip: tsc,test
