name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    uses: JakobMelchard/.github/.github/workflows/node.yml@e1ef2b10e7ee0c5426f78d63a4e9c6a0ce9b3fe9 # v1.6.0
    with:
      check-cmd: npx tsc
      # Regenerate from grammar.js: committed parser sources must match, and
      # the vectors run against the freshly built wasm.
      test-cmd: npm run build && git diff --exit-code -- src/ bindings/go/parser_sum.go && npm test

  go:
    uses: JakobMelchard/.github/.github/workflows/go.yml@e1ef2b10e7ee0c5426f78d63a4e9c6a0ce9b3fe9 # v1.6.0

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@e1ef2b10e7ee0c5426f78d63a4e9c6a0ce9b3fe9 # v1.6.0
    with:
      # tsc, eslint and npm test run in the js job above
      skip: tsc,eslint,test
