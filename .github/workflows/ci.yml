name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    uses: JakobMelchard/.github/.github/workflows/node.yml@df18859960a81d988ca3c7498bdd6a2dc976fec9 # v2.6.0
    with:
      check-cmd: npm run check
      lint-cmd: npx eslint --max-warnings 0 .
      # The vectors run against the committed wasm first, since that is what ships. Then
      # regenerate from grammar.js: committed parser sources must match, and the vectors run
      # against the freshly built wasm. The wasm itself is not byte-reproducible, so it is not diffed.
      test-cmd: npm test && npm run build && git diff --exit-code -- src/ bindings/go/parser_sum.go && npm test

  go:
    uses: JakobMelchard/.github/.github/workflows/go.yml@df18859960a81d988ca3c7498bdd6a2dc976fec9 # v2.6.0

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@df18859960a81d988ca3c7498bdd6a2dc976fec9 # v2.6.0
    with:
      # prettier, tsc, eslint and npm test run in the js job above
      skip: prettier,tsc,eslint,test
