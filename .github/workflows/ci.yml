name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    uses: JakobMelchard/.github/.github/workflows/node.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
    with:
      check-cmd: npx tsc
      # The vectors run against the committed wasm first, since that is what ships. Then
      # regenerate from grammar.js: committed parser sources must match, and the vectors run
      # against the freshly built wasm. The wasm itself is not byte-reproducible, so it is not diffed.
      test-cmd: npm test && npm run build && git diff --exit-code -- src/ bindings/go/parser_sum.go && npm test

  go:
    uses: JakobMelchard/.github/.github/workflows/go.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
    with:
      # tsc, eslint and npm test run in the js job above
      skip: tsc,eslint,test
